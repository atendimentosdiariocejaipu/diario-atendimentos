// 3. Funções de Navegação de Abas (Secretaria x Professor)[cite: 13]
function loginTab(aba) {
    const tabSec = document.getElementById('tabSec');
    const tabProf = document.getElementById('tabProf');
    const pSec = document.getElementById('pSec');
    const pProf = document.getElementById('pProf');

    if (aba === 'sec') {
        tabSec.classList.add('on');
        tabProf.classList.remove('on');
        pSec.classList.remove('hidden');
        pProf.classList.add('hidden');
    } else {
        tabProf.classList.add('on');
        tabSec.classList.remove('on');
        pProf.classList.remove('hidden');
        pSec.classList.add('hidden');
    }
}

// 4. Funções de Autenticação (Exemplo de integração)
async function entrarSec() {
    const senha = document.getElementById('secSenha').value;
    const erroSec = document.getElementById('errSec');
    
    if (!senha) {
        erroSec.innerText = 'Por favor, insira a senha.';
        return;
    }
    
    // Exemplo de verificação genérica (deve ser conectada ao banco)

        erroSec.innerText = 'Autenticando...';
        // Adicione a lógica de autenticação Supabase aqui

        document.getElementById('secApp').classList.remove('hidden');
    } catch (error) {
        erroSec.innerText = 'Erro ao conectar. Verifique suas credenciais.';
    }
}

async function entrarProf() {
    const nome = document.getElementById('profNome').value;

        erroProf.innerText = 'Autenticando...';

        document.getElementById('profApp').classList.remove('hidden');

}
